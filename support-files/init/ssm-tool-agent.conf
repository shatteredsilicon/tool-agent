# SSM Tool Agent

description    "SSM Tool Agent"



kill signal INT


start on stopped rc RUNLEVEL=[2345]
stop on runlevel [!2345]



respawn
respawn limit 10 5
umask 022

console none

pre-start script
    [ ! -f "$log_file" ] && touch "$log_file"
    chown "$user":"$group" "$log_file"
    test -x /opt/ss/tool-agent/tool-agent || { stop; exit 0; }
end script

# Start
exec /opt/ss/tool-agent/tool-agent >> /var/log/ssm-tool-agent.log 2>&1
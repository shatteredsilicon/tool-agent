# SSM Tool Agent

description    "SSM Tool Agent"

start on stopped rc RUNLEVEL=[2345]
stop on runlevel [!2345]

respawn
respawn limit 10 5
umask 022

setuid ssm
setgid ssm

console none

pre-start script
    [ ! -f /var/log/ssm-tool-agent.log ] && touch /var/log/ssm-tool-agent.log
    chown ssm:ssm /var/log/ssm-tool-agent.log
    test -x /opt/ss/tool-agent/tool-agent || { stop; exit 0; }
end script

# Start
exec /opt/ss/tool-agent/tool-agent >> /var/log/ssm-tool-agent.log 2>&1
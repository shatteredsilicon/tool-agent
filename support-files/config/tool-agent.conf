server-config = /opt/ss/ssm-client/ssm.yml

# log level, acceptable options are: debug, info, warn, error
log-level = info
# log format, acceptable options are: text, json
log-format = text

# interval of tools being ran. supported suffixes are ns, µs, ms, s, m and h
interval = 24h

# timeout to wait for tool output. supported suffixes are ns, µs, ms, s, m and h
timeout = 10m


; [pt-summary]
# command used to execute pt-summary and generates the summary
; executable = /path/to/pt-summary --param1 --param2
